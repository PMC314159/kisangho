<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f5f3ed">
  <meta name="description" content="기상호와의 AI 채팅. 비공식 팬 창작.">
  <title>상호에게</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <main class="chat-panel">
      <header class="chat-header">
        <div class="contact"><img class="mini-avatar" src="/sangho.jpg" alt="기상호 프로필 사진" width="42" height="42"><h2>기상호</h2></div>
        <div class="header-actions"><button id="refresh" type="button" title="대화 새로 불러오기" aria-label="대화 새로 불러오기">↻</button><button id="reset" type="button" title="대화와 기억 전체 초기화">초기화</button><button id="export" type="button">기록 보관</button></div>
      </header>

      <section class="conversation" id="conversation" aria-label="기상호와의 대화">
        <button class="load-older" id="load-older" type="button" hidden>이전 대화 불러오기</button>
        <div id="messages" role="log" aria-label="저장된 대화"></div>
        <div class="typing" id="typing" hidden><span></span><span></span><span></span><p>상호가 답장을 쓰고 있어요</p></div>
      </section>

      <div class="composer-area">
        <div id="notice" class="notice" role="status" hidden></div>
        <div class="composer-toolbar"><div class="mode-switch" role="group" aria-label="대화 형식"><button type="button" data-mode="chat" aria-pressed="true">문자</button><button type="button" data-mode="scene" aria-pressed="false">장면</button></div><span id="mode-hint">짧게 주고받는 일상</span></div>
        <form id="chat-form" class="composer">
          <label class="sr-only" for="message">상호에게 보낼 메시지</label>
          <textarea id="message" rows="1" maxlength="4000" placeholder="상호에게 이야기하기…" required></textarea>
          <button id="send" type="submit" aria-label="메시지 보내기"><span aria-hidden="true">↑</span></button>
        </form>
        <div class="composer-footer"><span id="char-count">0 / 4000</span></div>
      </div>
    </main>
  </div>
  <div id="announcement" class="sr-only" aria-live="polite"></div>
  <dialog id="reset-dialog" aria-labelledby="reset-title" aria-describedby="reset-description">
    <h2 id="reset-title">대화와 기억을 초기화할까요?</h2>
    <p id="reset-description">지금까지의 대화와 장기기억을 모두 지우고<br>영어학원 첫 만남부터 다시 시작해요.<br>삭제한 내용은 되돌릴 수 없어요.</p>
    <p id="reset-error" class="reset-error" role="alert" hidden></p>
    <div class="dialog-actions"><button id="reset-cancel" type="button" autofocus>취소</button><button id="reset-confirm" type="button">모두 초기화</button></div>
  </dialog>
</body>
</html>
